name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    name: selene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned to the same selene the project's rokit.toml uses. The full (non-light)
      # build ships the Roblox standard library that selene.toml selects.
      - name: Install selene 0.31.0
        run: |
          curl -fsSL -o selene.zip \
            https://github.com/Kampfkarren/selene/releases/download/0.31.0/selene-0.31.0-linux.zip
          unzip -q selene.zip
          chmod +x selene
          sudo mv selene /usr/local/bin/selene
          selene --version

      # Warnings are the long-standing baseline (mostly vendored ProfileStore); the
      # gate is "no new errors". Drop --allow-warnings once the baseline is clean.
      - name: Lint src
        run: selene --allow-warnings src
